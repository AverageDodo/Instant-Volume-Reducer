# Publishes a GitHub release whenever main gets a version that isn't released yet.
#
# The version is <Version> in src/InstantVolumeReducer/InstantVolumeReducer.csproj. On every push to main
# (normally a merged pull request from develop):
#   - tag v<Version> already exists     -> nothing to release, the run ends successfully
#   - version lower than latest release -> the run fails
#   - otherwise                         -> build, test, publish, build the Velopack installer and update
#                                          packages, assemble a draft release with the installer, the
#                                          portable exe, their SHA-256 checksums, and the update packages
#                                          and feed, then publish it, which creates tag v<Version> on this
#                                          commit
# Releases are immutable once published, so nothing is published until every file is attached. A
# failed run leaves at most a draft (and no tag); re-running the workflow removes the draft.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # Needed to create the release (and with it the tag).

concurrency:
  group: release
  cancel-in-progress: false # Never cancel a release half-way.

jobs:
  release:
    name: Build and release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # The release tags are needed to compare versions.

      - name: Read version
        id: info
        run: |
          $info = ./.github/scripts/Get-ReleaseInfo.ps1
          switch ($info.Status) {
            'release' { Write-Output "::notice::Releasing $($info.Tag)$(if ($info.IsPrerelease) { ' as a pre-release' })." }
            'already-released' { Write-Output "::notice::$($info.Tag) is already released, so there is nothing to release. Raise <Version> in the project file to release." }
            'older' {
              Write-Output "::error::Version $($info.Version) is lower than the latest release (v$($info.LatestRelease)). Raise <Version> in the project file."
              exit 1
            }
          }

      - name: Set up .NET
        if: steps.info.outputs.status == 'release'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        if: steps.info.outputs.status == 'release'
        run: dotnet test src --configuration Release

      - name: Publish
        if: steps.info.outputs.status == 'release'
        run: dotnet publish src/InstantVolumeReducer/InstantVolumeReducer.csproj -p:PublishProfile=win-x64

      - name: Restore tools
        if: steps.info.outputs.status == 'release'
        run: dotnet tool restore # vpk (Velopack's packaging tool), pinned in dotnet-tools.json

      - name: Download previous release (for delta updates)
        if: steps.info.outputs.status == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.info.outputs.prerelease }}
        run: |
          # With the previous release's full package in the output folder, vpk pack also builds a small
          # delta package, so installed copies download only what changed.
          $downloadArgs = @(
            'vpk', 'download', 'github',
            '--repoUrl', "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY",
            '--token', $env:GH_TOKEN,
            '--outputDir', 'velopack'
          )
          if ($env:PRERELEASE -eq 'true') { $downloadArgs += '--pre' }
          dotnet @downloadArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::notice::No earlier release with update packages was found, so this release has no delta package."
          }
          exit 0

      - name: Build installer and update packages
        if: steps.info.outputs.status == 'release'
        env:
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          dotnet vpk pack `
            --packId InstantVolumeReducer `
            --packVersion $env:VERSION `
            --packTitle "Instant Volume Reducer" `
            --runtime win-x64 `
            --packDir src/InstantVolumeReducer/bin/publish/win-x64 `
            --mainExe InstantVolumeReducer.exe `
            --icon src/InstantVolumeReducer/Resources/AppIcon.ico `
            --shortcuts StartMenuRoot `
            --noPortable `
            --outputDir velopack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem velopack | Format-Table Name, Length

      - name: Package
        if: steps.info.outputs.status == 'release'
        env:
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          # The portable exe, for people who don't want to install anything.
          $portable = "InstantVolumeReducer-$env:TAG-win-x64.exe"
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item -LiteralPath src/InstantVolumeReducer/bin/publish/win-x64/InstantVolumeReducer.exe -Destination "artifacts/$portable"

          # Checksums in sha256sum format, so `sha256sum -c` works as well as comparing by eye.
          foreach ($file in "artifacts/$portable", 'velopack/InstantVolumeReducer-win-Setup.exe') {
            $name = Split-Path -Leaf $file
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath "artifacts/$name.sha256" -Value "$hash  $name" -Encoding ascii
          }
          Get-ChildItem artifacts | Format-Table Name, Length

      # The repository has immutable releases turned on: once published, a release's files can't change.
      # So the release is assembled as a draft and published only when every file is attached. Until
      # then no tag exists, and a failed run leaves at most a draft, which the next run removes.

      - name: Remove a draft left by an earlier failed run
        if: steps.info.outputs.status == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          $isDraft = gh release view $env:TAG --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($isDraft -ne 'true') {
              Write-Output "::error::A published release $env:TAG already exists without its tag. Check the releases page."
              exit 1
            }
            Write-Output "::notice::Removing the draft release $env:TAG left by an earlier run."
            gh release delete $env:TAG --yes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          exit 0

      - name: Create draft release with installer and update packages
        if: steps.info.outputs.status == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
          PRERELEASE: ${{ steps.info.outputs.prerelease }}
        run: |
          # Velopack uploads the setup, this version's packages and the releases.win.json feed that
          # installed copies read, in the layout its GitHub update source expects.
          $uploadArgs = @(
            'vpk', 'upload', 'github',
            '--repoUrl', "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY",
            '--token', $env:GH_TOKEN,
            '--outputDir', 'velopack',
            '--tag', $env:TAG,
            '--targetCommitish', $env:GITHUB_SHA,
            '--releaseName', "Instant Volume Reducer $env:TAG"
          )
          if ($env:PRERELEASE -eq 'true') { $uploadArgs += '--pre' }
          dotnet @uploadArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add portable exe and checksums
        if: steps.info.outputs.status == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          $ghArgs = @('release', 'upload', $env:TAG) + @((Get-ChildItem artifacts).FullName)
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish release
        if: steps.info.outputs.status == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
          PRERELEASE: ${{ steps.info.outputs.prerelease }}
        run: |
          # Notes from the pull requests merged since the previous release, as `--generate-notes` would
          # write them; publishing creates the tag on this commit and makes the release immutable.
          $notes = gh api "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=$env:TAG" -f "target_commitish=$env:GITHUB_SHA" --jq .body
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding utf8

          $ghArgs = @(
            'release', 'edit', $env:TAG,
            '--draft=false',
            '--target', $env:GITHUB_SHA,
            '--title', "Instant Volume Reducer $env:TAG",
            '--notes-file', $notesFile
          )
          $ghArgs += if ($env:PRERELEASE -eq 'true') { '--prerelease' } else { '--latest' }
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Explain a failed release
        if: failure() && steps.info.outputs.status == 'release'
        env:
          TAG: ${{ steps.info.outputs.tag }}
        run: Write-Output "::error::$env:TAG wasn't published. At most a draft release exists; re-running this workflow removes it and starts over."
